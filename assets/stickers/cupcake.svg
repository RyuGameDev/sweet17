  <line x1="30" y1="33" x2="34" y2="35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="34" x2="44" y2="31" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />

  <defs>
    <linearGradient id="frostingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
