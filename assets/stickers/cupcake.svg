<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Wrapper Base -->
  <polygon points="18,36 22,58 42,58 46,36" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5" />
  <line x1="26" y1="36" x2="28" y2="58" stroke="#f472b6" stroke-width="1" />
  <line x1="32" y1="36" x2="32" y2="58" stroke="#f472b6" stroke-width="1" />
  <line x1="38" y1="36" x2="36" y2="58" stroke="#f472b6" stroke-width="1" />

  <!-- Frosting Swirl -->
  <path d="M14,36 C14,31 20,28 26,30 C27,24 35,22 40,26 C46,24 50,30 50,36 C50,40 14,40 14,36 Z" fill="url(#frostingGrad)" />
  <path d="M22,26 C24,20 32,18 36,22 C40,20 44,24 42,28 C34,26 26,24 22,26 Z" fill="#fdf2f8" />
  
