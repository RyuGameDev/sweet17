<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Left Tail -->
  <path d="M26,34 Q14,48 10,58 Q22,54 30,42 Z" fill="#e11d48" />
  <!-- Right Tail -->
  <path d="M38,34 Q50,48 54,58 Q42,54 34,42 Z" fill="#be123c" />

  <!-- Left Bow Loop -->
  <path d="M30,30 C12,18 6,38 28,34 Z" fill="url(#bowGradPink)" />
  <ellipse cx="20" cy="27" rx="6" ry="3" transform="rotate(-15 20 27)" fill="#ffffff" opacity="0.35" />

  <!-- Right Bow Loop -->
  <path d="M34,30 C52,18 58,38 36,34 Z" fill="url(#bowGradRose)" />
  <ellipse cx="44" cy="27" rx="6" ry="3" transform="rotate(15 44 27)" fill="#ffffff" opacity="0.35" />

  <!-- Center Knot -->
  <ellipse cx="32" cy="32" rx="6" ry="5.5" fill="#f43f5e" stroke="#fda4af" stroke-width="1" />

  <defs>
    <linearGradient id="bowGradPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="bowGradRose" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
</svg>
