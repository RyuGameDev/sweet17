<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Shadow -->
  <ellipse cx="32" cy="56" rx="20" ry="4" fill="rgba(0,0,0,0.25)" />

  <!-- Box Body -->
  <rect x="14" y="28" width="36" height="26" rx="4" fill="url(#giftBodyGrad)" />
  <!-- Box Vertical Ribbon -->
  <rect x="28" y="28" width="8" height="26" fill="url(#goldRibbonGrad)" />

  <!-- Lid -->
  <rect x="11" y="20" width="42" height="10" rx="3" fill="url(#giftLidGrad)" />
  <!-- Lid Ribbon -->
  <rect x="28" y="20" width="8" height="10" fill="url(#goldRibbonGrad)" />

  <!-- Bow Loops -->
  <path d="M24,20 C18,12 24,6 30,14 C31,16 31,19 31,20 Z" fill="url(#goldRibbonGrad)" />
  <path d="M40,20 C46,12 40,6 34,14 C33,16 33,19 33,20 Z" fill="url(#goldRibbonGrad)" />
  <!-- Bow Knot -->
  <circle cx="32" cy="18" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
  
  <!-- Sparkles -->
  <polygon points="52,14 54,18 58,19 54,21 52,25 50,21 46,19 50,18" fill="#fde047" />

  <defs>
    <linearGradient id="giftBodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="giftLidGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="goldRibbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
</svg>
