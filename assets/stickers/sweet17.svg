<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Ribbon tails -->
  <polygon points="26,36 18,60 26,54 32,60 28,36" fill="#be123c" />
  <polygon points="38,36 46,60 38,54 32,60 36,36" fill="#9f1239" />
  
  <!-- Rosette Circle Outer -->
  <circle cx="32" cy="26" r="22" fill="#fb7185" stroke="#f43f5e" stroke-width="2" />
  
  <!-- Rosette Circle Inner Gold -->
  <circle cx="32" cy="26" r="17" fill="url(#goldBadgeGrad)" stroke="#f59e0b" stroke-width="1.5" />
  
  <!-- Number 17 Text -->
  <text x="32" y="32" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="bold" fill="#881337" text-anchor="middle">17</text>
  
  <!-- Crown on Top -->
  <polygon points="24,11 26,16 32,13 38,16 40,11 36,7 32,9 28,7" fill="#fbbf24" stroke="#d97706" stroke-width="0.8" />

  <defs>
    <linearGradient id="goldBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
</svg>
